[project]
name = "youtube-vocab"
version = "0.1.0"
description = "Extract useful English vocabulary and expressions from YouTube captions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "openai>=1.68.0",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "rich>=13.9",
  "spacy>=3.8",
  "typer>=0.15",
  "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
ytdlp = ["yt-dlp>=2025.1.15"]

[project.scripts]
ytvocab = "youtube_vocab.cli:app"

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "ruff>=0.9", "types-setuptools>=75.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youtube_vocab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["youtube_vocab"]
